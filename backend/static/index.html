<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>医疗 AI 导诊助手</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:"Microsoft YaHei","PingFang SC",sans-serif; height:100vh; display:flex; background:#f5f7fa; color:#1f2329; }
  .sidebar { width:270px; background:#fff; border-right:1px solid #e8ebf0; display:flex; flex-direction:column; }
  .brand { padding:20px 18px; border-bottom:1px solid #eef0f4; }
  .brand h1 { font-size:16px; color:#2f6fed; font-weight:700; }
  .brand p { font-size:11px; color:#9aa1ac; margin-top:4px; }
  .new-btn { margin:14px 16px; padding:9px; background:#2f6fed; color:#fff; border:none; border-radius:8px; cursor:pointer; font-size:13px; }
  .new-btn:hover { background:#2559c9; }
  .history-title { padding:6px 18px; font-size:11px; color:#9aa1ac; letter-spacing:1px; }
  .history-list { flex:1; overflow-y:auto; padding:0 10px 16px; }
  .history-item { padding:10px 12px; margin:3px 0; border-radius:8px; font-size:12px; cursor:pointer; color:#4a5058; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .history-item:hover { background:#f0f4ff; }
  .history-item.active { background:#e8f0ff; color:#2f6fed; }
  .main { flex:1; display:flex; flex-direction:column; }
  .topbar { height:52px; background:#fff; border-bottom:1px solid #e8ebf0; display:flex; align-items:center; padding:0 24px; justify-content:space-between; }
  .topbar .status { font-size:12px; color:#8a9099; }
  .status b { color:#1d9e75; }
  .chat { flex:1; overflow-y:auto; padding:24px 8%; }
  .msg { margin-bottom:20px; display:flex; }
  .msg.user { justify-content:flex-end; }
  .bubble { max-width:78%; padding:12px 16px; border-radius:14px; line-height:1.75; font-size:13.5px; white-space:pre-wrap; }
  .msg.user .bubble { background:#2f6fed; color:#fff; border-bottom-right-radius:4px; }
  .msg.ai .bubble { background:#fff; border:1px solid #e8ebf0; border-bottom-left-radius:4px; }
  .stage { font-size:11.5px; color:#8a9099; margin:6px 0 10px; display:flex; align-items:center; gap:6px; }
  .dot { width:6px; height:6px; background:#2f6fed; border-radius:50%; animation:pulse 1s infinite; }
  @keyframes pulse { 0%,100%{opacity:.3} 50%{opacity:1} }
  .sources { margin-top:10px; padding:8px 12px; background:#f7f9fc; border-radius:8px; font-size:11.5px; color:#5f6672; }
  .sources b { color:#2f6fed; }
  .meta { margin-top:6px; font-size:10.5px; color:#a4abb5; }
  .input-area { background:#fff; border-top:1px solid #e8ebf0; padding:14px 8%; }
  .input-row { display:flex; gap:10px; }
  .input-row input { flex:1; padding:12px 16px; border:1px solid #dfe3ea; border-radius:10px; font-size:13.5px; outline:none; }
  .input-row input:focus { border-color:#2f6fed; }
  .input-row button { padding:0 24px; background:#2f6fed; color:#fff; border:none; border-radius:10px; cursor:pointer; font-size:13.5px; }
  .input-row button:disabled { background:#b8c6e6; cursor:not-allowed; }
  .tip { margin-top:8px; font-size:11px; color:#a4abb5; text-align:center; }
  .empty { text-align:center; color:#a4abb5; margin-top:15vh; }
  .empty h2 { font-size:20px; color:#4a5058; margin-bottom:10px; }
</style>
</head>
<body>
<div class="sidebar">
  <div class="brand"><h1>医疗 AI 导诊助手</h1><p>知识图谱 + Agent · 辅助自查</p></div>
  <button class="new-btn" onclick="newChat()">＋ 新建对话</button>
  <div class="history-title">历史会话</div>
  <div class="history-list" id="historyList"></div>
</div>
<div class="main">
  <div class="topbar">
    <div style="font-size:13px;font-weight:600">智能问诊</div>
    <div class="status" id="status">连接中…</div>
  </div>
  <div class="chat" id="chat">
    <div class="empty" id="empty">
      <h2>你好，我是图灵小助</h2>
      <p>描述你的不适症状，我会结合知识图谱给出辅助分析<br>例如：我最近老是口渴、尿多，还瘦了</p>
    </div>
  </div>
  <div class="input-area">
    <div class="input-row">
      <input id="question" placeholder="描述你的症状或想了解的问题…" onkeydown="if(event.key==='Enter')send()">
      <button id="sendBtn" onclick="send()">发送</button>
    </div>
    <div class="tip">⚠️ 辅助自查参考，不能替代执业医师诊断，如有不适请及时就医</div>
  </div>
</div>
<script>
let sessionId = 'web-' + Math.random().toString(36).slice(2, 8);
let busy = false;

fetch('/api/health').then(r=>r.json()).then(d=>{
  document.getElementById('status').innerHTML =
    'Neo4j <b>' + (d.neo4j==='ok'?'✓':'✗') + '</b> ｜ LLM <b>' + (d.llm==='ok'?'✓':'✗') + '</b> ｜ 缓存 <b>' + d.cache + '</b>';
}).catch(()=>{document.getElementById('status').textContent='服务未连接';});

function loadHistory() {
  fetch('/sessions').then(r=>r.json()).then(d=>{
    const el = document.getElementById('historyList');
    el.innerHTML = '';
    (d.sessions||[]).forEach(s=>{
      const div = document.createElement('div');
      div.className = 'history-item' + (s.session_id===sessionId?' active':'');
      div.textContent = s.session_id + ' (' + s.count + '条)';
      div.onclick = ()=>loadSession(s.session_id);
      el.appendChild(div);
    });
  });
}
function loadSession(sid) {
  sessionId = sid;
  fetch('/history/'+sid).then(r=>r.json()).then(d=>{
    const chat = document.getElementById('chat');
    chat.innerHTML = '';
    document.getElementById('empty').style.display='none';
    (d.items||[]).forEach(it=>{
      addBubble('user', it.q);
      const b = addBubble('ai', it.a);
      if (it.meta && it.meta.sources && it.meta.sources.length) addSources(b.parentElement, it.meta.sources, it.meta);
    });
    loadHistory();
  });
}
function newChat() {
  sessionId = 'web-' + Math.random().toString(36).slice(2, 8);
  document.getElementById('chat').innerHTML = '<div class="empty" id="empty"><h2>你好，我是图灵小助</h2><p>描述你的不适症状，我会结合知识图谱给出辅助分析</p></div>';
  loadHistory();
}
function addBubble(role, text) {
  const chat = document.getElementById('chat');
  const empty = document.getElementById('empty');
  if (empty) empty.style.display='none';
  const msg = document.createElement('div');
  msg.className = 'msg ' + role;
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;
  msg.appendChild(bubble);
  chat.appendChild(msg);
  chat.scrollTop = chat.scrollHeight;
  return bubble;
}
function addSources(msgEl, sources, meta) {
  const box = document.createElement('div');
  box.className = 'sources';
  let html = '<b>参考来源：</b>' + sources.map(s=>s.name || s.text || s.type).join(' ｜ ');
  html += '<div class="meta">引擎：' + (meta.engine||'pipeline') + (meta.route?(' ｜ 路由：'+meta.route):'') + ' ｜ 意图：' + (meta.intent||'—') + ' ｜ 置信度：' + (meta.confidence ?? '—') + ' ｜ 耗时：' + (meta.elapsed_s ?? '—') + 's' + (meta.cached?' ｜ 缓存命中':'') + '</div>';
  box.innerHTML = html;
  msgEl.appendChild(box);
}
async function send() {
  if (busy) return;
  const input = document.getElementById('question');
  const q = input.value.trim();
  if (!q) return;
  input.value = '';
  busy = true;
  document.getElementById('sendBtn').disabled = true;
  addBubble('user', q);

  const aiMsg = document.createElement('div');
  aiMsg.className = 'msg ai';
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  const stage = document.createElement('div');
  stage.className = 'stage';
  stage.innerHTML = '<span class="dot"></span><span>正在连接…</span>';
  aiMsg.appendChild(stage);
  aiMsg.appendChild(bubble);
  document.getElementById('chat').appendChild(aiMsg);

  try {
    const resp = await fetch('/chat', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({question:q, session_id:sessionId})
    });
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    let answer = '';
    let meta = null;
    while (true) {
      const {done, value} = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, {stream:true});
      const parts = buffer.split('\n\n');
      buffer = parts.pop();
      for (const part of parts) {
        const line = part.split('\n').find(l=>l.startsWith('data: '));
        const evt = part.split('\n').find(l=>l.startsWith('event: '));
        if (!line || !evt) continue;
        const data = JSON.parse(line.slice(6));
        const event = evt.slice(7);
        if (event === 'stage') {
          stage.innerHTML = '<span class="dot"></span><span>' + data.msg + '</span>';
        } else if (event === 'token') {
          stage.style.display = 'none';
          answer += data.text;
          bubble.textContent = answer;
          document.getElementById('chat').scrollTop = 99999;
        } else if (event === 'done') {
          meta = data;
        }
      }
    }
    if (meta) addSources(aiMsg, meta.sources||[], meta);
    loadHistory();
  } catch(e) {
    bubble.textContent = '请求失败：' + e.message;
  } finally {
    busy = false;
    document.getElementById('sendBtn').disabled = false;
  }
}
loadHistory();
</script>
</body>
</html>
