# 医疗 AI 导诊助手 · 一键启动
# 用法：docker compose up -d
# 访问：前端 http://localhost:8002
#
# 三个服务：
#   neo4j  —— 知识图谱（31 节点 / 42 关系，首次需导入）
#   redis  —— 高频问答缓存
#   api    —— FastAPI + LangGraph 编排

services:
  neo4j:
    image: neo4j:3.5.28
    container_name: medical-agent-neo4j
    environment:
      NEO4J_AUTH: neo4j/123456
      NEO4J_dbms_connector_bolt_listen__address: "0.0.0.0:7687"
      NEO4J_dbms_connector_http_listen__address: "0.0.0.0:7474"
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - ./docker/neo4j/data:/data
      - ./data:/import:ro          # 挂载 CSV，便于容器内导入
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: medical-agent-redis
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - ./docker/redis/data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build: .
    container_name: medical-agent-api
    ports:
      - "8002:8002"
    environment:
      - HF_ENDPOINT=https://hf-mirror.com
      - PYTHONIOENCODING=utf-8
      - REDIS_URL=redis://redis:6379/0
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_PASSWORD=123456
      - AGENT_ENGINE=langgraph
    env_file:
      - .env                       # DASHSCOPE_API_KEY（不进 git）
    volumes:
      - ./fastapi_app/history.json:/app/fastapi_app/history.json
    depends_on:
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
